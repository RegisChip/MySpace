<!-- Conecion a la base de datos -->

<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <title>Base de Datos</title>
    </head>

    <body>
        <nav>
            <a href="/">MySpace</a>
        </nav>

        <h1>Base de datos conectada</h1>

        {% if db_ok %}

            <p>La conexión a la base de datos se ha realizado con éxito.</p>

            {% for usuario in user %}
                <div>
                    
                    <p>Nombre: <span style="color:rgb(43, 135, 255);">{{usuario.nombre}}</span></p>
                    <p>Correo: {{usuario.correo}}</p>
                    
                </div>
            {% endfor %}

        {% else %}
            <p>Error al conectar con la base de datos.</p>
        {% endif %}
        
    </body>
</html>
