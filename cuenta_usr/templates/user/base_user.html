<!DOCTYPE html>
<html lang="es">
<head>
    <!-- metadatos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="MySpace">
    <meta name="description" content="Red Social MySpace">
    <meta name="author" content="Christian Regina Rodriguez Magaña, Leonardo Blanco Ambriz">
    <!-- <meta http-equiv="refresh" content="30"> -->

    <!-- links -->
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'myspace.ico' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'myspace.ico' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style-cuenta.css' %}">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- fonds -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Bree+Serif&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&family=Anaheim:wght@400..800&family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Bree+Serif&display=swap" rel="stylesheet">
        <!-- Scrips -->

    <!-- elementos -->
    <title>{% block title %}MySpace{% endblock %}</title>
</head>
<body>
  <div class="content-grid">
    <header id="head-base">
            <h1><a href="{% url 'principal' %}">MySpace</a></h1>
      <p>{% block ubicacion %}{% endblock %}</p>
    </header>

    <main id="main-base">
      <div class="main-content">
        {% block content %}
        
        {% endblock %}
      </div>
      
      <footer id="main-foot">
        <p>
          <a href="https://validator.w3.org/#validate_by_input" target="_blank">
            <img style="border:0;width:88px;height:31px"
              src="{% static 'media/w3c-html.png' %}" 
              alt="Valid HTML!">
          </a>
        </p>
        <p>
          <a href="https://jigsaw.w3.org/css-validator/#validate_by_input" target="_blank">
            <img style="border:0;width:88px;height:31px"
              src="https://jigsaw.w3.org/css-validator/images/vcss-blue"
              alt="Valid CSS!">
          </a>
        </p>
      </footer>
    </main>

    <footer id="foot-base">
      <ul>
        <li><a href="#">Acerca de</a> |</li>
        <li><a href="#">Reglas</a> |</li>
        <li><a href="#">Términos y condiciones</a> |</li>
        <li><a href="#">Privacidad</a> |</li>
        <li><a href="#">Contacto</a> |</li>
      </ul>
      <p>&copy;2025 - MySpace.com Todos los derechos reservados</p>
    </footer>
  </div>

</body>
</html>
