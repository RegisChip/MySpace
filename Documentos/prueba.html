<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - MySpace</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #dfe8f3;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 500px;
      margin: 40px auto;
      background: #f0f7ff;
      border: 1px solid #a0b6d9;
      box-shadow: 0px 0px 5px rgba(0,0,0,0.1);
    }

    .header {
      background: #a9c2e6;
      padding: 15px;
      font-size: 28px;
      font-weight: bold;
      color: #fff;
    }
    .header span {
      font-weight: normal;
      font-size: 22px;
    }

    form {
      padding: 20px;
      text-align: center;
    }

    table {
      margin: 0 auto;
    }

    td {
      padding: 8px;
      font-weight: bold;
      color: #2a4a77;
    }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 250px;
      padding: 5px;
      border: 1px solid #6b8ebf;
    }

    .btn {
      margin-top: 15px;
      padding: 8px 20px;
      background: #6b8ebf;
      border: none;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover {
      background: #4d6ea5;
    }

    .footer {
      background: #c4d6f0;
      text-align: center;
      padding: 10px;
      font-size: 12px;
    }
    .footer a {
      margin: 0 5px;
      color: #2a4a77;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }

    .login {
      text-align: center;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      MySpace <span>| Registro</span>
    </div>
    <form>
      <table>
        <tr>
          <td>Nombre</td>
          <td><input type="text" name="nombre"></td>
        </tr>
        <tr>
          <td>Apellido Paterno</td>
          <td><input type="text" name="apaterno"></td>
        </tr>
        <tr>
          <td>Apellido Materno</td>
          <td><input type="text" name="amaterno"></td>
        </tr>
        <tr>
          <td>Correo</td>
          <td><input type="email" name="correo"></td>
        </tr>
        <tr>
          <td>Contraseña</td>
          <td><input type="password" name="pass1"></td>
        </tr>
        <tr>
          <td>Contraseña</td>
          <td><input type="password" name="pass2"></td>
        </tr>
      </table>
      <button type="submit" class="btn">Registrarse</button>
    </form>
    <div class="login">
      ¿Ya tienes cuenta? <a href="#">Inicia Sesión</a>
    </div>
    <div class="footer">
      <a href="#">Acerca de</a> • 
      <a href="#">Reglas</a> • 
      <a href="#">Términos y Condiciones</a> • 
      <a href="#">Privacidad</a> • 
      <a href="#">Contactos</a>
      <br>
      ©2025 - MySpace.com Todos los derechos reservados
    </div>
  </div>
</body>
</html>
